components:
  schemas:
    GetHealthcheckPositiveResponse:
      type: object
      properties:
        status:
          type: string
          const: success
        data:
          type: object
          properties:
            status:
              type: string
            timestamp:
              type: string
          required:
            - status
            - timestamp
          additionalProperties: false
      required:
        - status
        - data
      additionalProperties: false
    GetHealthcheckNegativeResponse:
      type: object
      properties:
        status:
          type: string
          const: error
        error:
          type: object
          properties:
            message:
              type: string
          required:
            - message
          additionalProperties: false
      required:
        - status
        - error
      additionalProperties: false
    GetTfOpsApiV1HcpIntegrationsIntegrationIdParameterIntegrationId:
      type: string
    GetTfOpsApiV1HcpIntegrationsIntegrationIdParameterXOrganizationId:
      type: string
    GetTfOpsApiV1HcpIntegrationsIntegrationIdPositiveResponse:
      type: object
      properties:
        status:
          type: string
          const: success
        data:
          type: object
          properties:
            deletedAt: {}
            integrationId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
            organizationId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
            createdBy:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            name:
              type: string
            HMACKey:
              type: string
            createdAt: {}
            webhookUrl:
              type: string
              format: uri
            type:
              type: string
              enum:
                - RUN_TASK
                - NOTIFICATION
          required:
            - integrationId
            - organizationId
            - createdBy
            - name
            - HMACKey
            - createdAt
            - webhookUrl
            - type
          additionalProperties: false
      required:
        - status
        - data
      additionalProperties: false
    GetTfOpsApiV1HcpIntegrationsIntegrationIdNegativeResponse:
      type: object
      properties:
        status:
          type: string
          const: error
        error:
          type: object
          properties:
            message:
              type: string
          required:
            - message
          additionalProperties: false
      required:
        - status
        - error
      additionalProperties: false
    HeadTfOpsApiV1HcpIntegrationsIntegrationIdParameterIntegrationId:
      type: string
